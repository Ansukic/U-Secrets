.pill{position:absolute;top:12px;left:14px;background:#10a79b33;color:#7ee8de;border:1px solid #10a79b;border-radius:999px;padding:1px 12px;font-size:13px;font-weight:600;text-transform:uppercase}

.tb h3:first-child{margin-top:0}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:6px 0 14px}

.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}

.vs .m{border-left:5px solid #c0392b}.vs .f{border-left:5px solid #2e8b57}

.callout{border-left:5px solid var(--teal);background:var(--bg);padding:10px 14px;font-style:italic;color:var(--muted);margin-top:10px}
footer{margin-top:40px;background:var(--bar2);color:#e6e6e6;padding:24px 0;font-size:14px}

@media (max-width:1100px){

function Campus() {
  return [
    Tile("Topic 1", "The Birth of the University City", [
      P("The Ciudad Universitaria was a revolutionary idea. In 1935, President Alfonso López Pumarejo pushed through a major university reform (Law 68). Until then, the university was a collection of schools scattered all over Bogotá. The reform gathered the faculties on a single campus."),
      h("div", { className: "grid", key: "g" }, Stat("1935", "Law 68, university reform"), Stat("~120 ha", "campus size today"), Stat("17", "national monuments"), Stat("1st", "university city in Latin America")),
      H3("The people behind it"),
      P("The government invited two Germans who had come to Colombia seeking refuge from the political situation in Europe: pedagogue Fritz Karsen, who brought the educational vision, and architect Leopoldo Rother, who designed the physical space. Their work, starting around 1936, produced the first university city in Latin America, at what was then the western edge of Bogotá.")
    ], true, "Essential"),
    Tile("Design", "A Complete Little City", [
      P("It included faculties, research institutes, recreation areas and even student housing, similar to the American campus model. It was designed without walls, reflecting a public, open and autonomous university meant to be part of the city."),
      P("The architecture was modern and functional, influenced by the Bauhaus, with symmetrical buildings, lots of light and green spaces. The original buildings were white, so the historic core is also called “la Ciudad Blanca”, the White City.")
    ]),
    Tile("Today", "Open Campus vs. Safety", [
      P("The campus is no longer completely barrier-free. Its size, riots by hooded protesters, an explosion in the Sociology building in September 2025, and serious incidents during unregulated parties (including a reported sexual assault in 2024) led to reinforced fencing, cameras, lighting and ID checks."),
      P("Directors insist it remains open to the public, with academic, sports and cultural events, even concerts by the Bogotá Philharmonic. Some critics say the controls betray the original idea of Rother and Karsen."),
      h("div", { className: "callout", key: "c" }, "How do you keep a campus open to everyone, while keeping everyone safe?")
    ]),
    Tile("Fun fact", "The Owl-Shaped Campus", [
      P("Seen from above, the campus plan looks like an owl: the main axes spread out symmetrically like wings, and the key faculty and administration buildings form the head. A famous plan drawn by Rother and Erich Lange in 1937 shows this shape."),
      P("According to architectural historians, the owl was probably not deliberate. It is more the result of Rother’s rational and organic way of organizing the campus around central circulation axes. Still, an owl, a symbol of wisdom and knowledge, fits a university perfectly.")
    ], true)
  ];
}
function Salmona() {
  return [
    Tile("Topic 2", "The Paradox of Rogelio Salmona", [
      P("Imagine learning from one of the most influential architects in the world and becoming one of the most important architects in your own country, without following the traditional academic path."),
      h("div", { className: "tl", key: "t" },
        Item("1947", "Le Corbusier visits Bogotá. Salmona, a young architecture student at the Universidad Nacional who speaks French, works as his translator."),
        Item("1948", "After the Bogotazo, Salmona moves to Paris and joins Le Corbusier’s studio, working there for several years. He also studies art history and sociology of art."),
        Item("1962", "Back in Colombia, he obtains his architecture degree from the Universidad de los Andes. Some accounts describe difficulties in completing his formal academic path."),
        Item("2000", "The Universidad Nacional inaugurates his Graduate Studies Building for the Faculty of Human Sciences and awards him a Doctor Honoris Causa.")
      )
    ], true, "Story"),
    Tile("Reflection", "Why It Matters", [
      P("The paradox: the university where his formal path was complicated later invited him to design one of its important buildings and honored him for his contribution to architecture."),
      P("Academic degrees are valuable, but creativity, experience and contributions to society are also essential. A person’s professional legacy can go beyond the limits of a traditional academic path.")
    ], true)
  ];
}
function Pool() {
  return [
    Tile("Topic 3", "The Debunked Myth: The Pool That Never Was", [
      P("Many students have heard that the Bogotá campus once had a swimming pool, somewhere near the sports area, closed years ago. The historical record says otherwise."),
      h("div", { className: "vs", key: "v" },
        h("div", { className: "m" }, h("h3", null, "❌ The myth"), P("There was a pool on campus and it was closed or forgotten.")),
        h("div", { className: "f" }, h("h3", null, "✅ The facts"), P("It was planned, never built. The pool stayed in the drawings."))
      )
    ], true, "Myth busted"),
    Tile("Origins", "Where the Myth Comes From", [
      P("Rother’s original design included an area for sports and physical education, the Instituto de Educación Física, dating from 1937. The plan in the university’s 1939 yearbook lists an indoor swimming pool among its buildings."),
      P("But the campus was never finished as drawn: according to historian Carlos Niño Murcia, of that institute only the stadium was built. Over time, “the pool the campus was supposed to have” likely became “the pool the campus used to have.”")
    ]),
    Tile("Context", "A Reasonable Assumption", [
      P("It is not a crazy idea: the Ciudad Universitaria of UNAM in Mexico has an Olympic pool, built in 1954, which hosted events during the 1968 Olympic Games."),
      h("div", { className: "callout", key: "c" }, "The real story isn’t “the pool disappeared”; it’s “the pool never arrived.”")
    ])
  ];
}
